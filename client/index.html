<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Manchester College Portal</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3f4f6; padding: 16px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
        <div style="background: #ffffff; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 31, 109, 0.08); max-width: 448px; width: 100%; text-align: center; border-bottom: 8px solid #c5a059;">
          <div style="width: 80px; height: 80px; border-radius: 20px; overflow: hidden; margin: 0 auto 20px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); background: #ffffff; padding: 4px; border: 1px solid #f1f5f9;">
            <img src="/ManchesterLogo.jpeg" alt="Manchester College" style="width: 100%; height: 100%; object-fit: cover; border-radius: 16px;" />
          </div>
          <h1 style="font-size: 24px; font-weight: 900; color: #001f6d; margin: 0 0 4px 0; letter-spacing: -0.02em;">Manchester College</h1>
          <p style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 24px 0;">Institutional Assessment Portal</p>
          <div style="display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px; color: #001f6d; font-size: 12px; font-weight: 700;">
            <div style="width: 16px; height: 16px; border: 3px solid #001f6d; border-top-color: #c5a059; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <span>Loading Portal...</span>
          </div>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
